[project]
name = "funtorch"
version = "0.0.4"
description = "面向 PyTorch 工具链的轻量 Python 包，提供可复现的版本化发布基础。"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.urls]
Homepage = "https://pypi.org/project/funtorch/"
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funtorch"
Releases = "https://github.com/farfarfun/funtorch/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["funbuild>=1.6.66", "pytest>=8.0", "ruff>=0.12.7"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP", "W"]
